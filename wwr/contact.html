<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting | Contact Us</title>
    <meta name="description"
      content="Contact White Water Rafting Company. Find our address, phone, email, map, and connect with our team.">
    <meta name="author" content="Usanga Mfon-Obong Effiong">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-splash.png" alt="Rafting Site Logo" width="200">
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <!-- Company Information -->
        <section class="company-info">
            <h1>White Water Rafting Company</h1>
            <p>G 90 Ewet Housing Estate<br>Uyo, Akwa Ibom State</p>
            <p>Phone: +234 806 825 9200</p>
            <p>Email: info@whitewater.com</p>
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d15898.150075855536!2d7.935712273730463!3d5.0161768950484085!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1775216952349!5m2!1sen!2sng"
              width="300" height="200" style="border:0;" allowfullscreen="" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"></iframe>
        </section>

        <!-- Contact Form -->
        <section class="contact-form">
            <h2>Get in Touch</h2>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <p>Purpose of Message:</p>
                <label><input type="radio" name="purpose" value="general"> General Inquiry</label>
                <label><input type="radio" name="purpose" value="reservation"> Reservation
                    Question</label>
                <label><input type="radio" name="purpose" value="suggestion"> Website
                    Suggestion</label>

                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>

                <label><input type="checkbox" name="subscribe"> Please subscribe me to the monthly
                    newsletter</label>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>

        <!-- Employee Profiles -->
        <section class="team">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/employee1.jpg" alt="Harvey Usanga">
                <figcaption>Harvey Usanga - Lead Guide</figcaption>
            </figure>
            <img src="images/employee2.jpg" alt="Henrietta Mfon">
            <figcaption>Henrietta Mfon - HR Manager</figcaption>
            <figure>
                <img src="images/employee3.jpg" alt="Aurelia Omari">
                <figcaption>Aurelia Omari - Supervisor</figcaption>
